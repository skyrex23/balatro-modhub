version: '3'

tasks:
  default:
    desc: List the available Steam tasks
    cmds:
      - task --list --taskfile {{.TASKFILE}}
    silent: true

  launch-options:
    desc: Set the launch options of Balatro in the Steam configuration (task steam:launch-options -- --force)
    cmds:
      - bash scripts/steam.sh launch-options {{.CLI_ARGS}}

  check:
    desc: Show the launch options of Balatro
    cmds:
      - bash scripts/steam.sh check
